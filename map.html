<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Verse — World of Resona — Interactive Map</title>
<link rel="icon" href="assets/logos/favicon.png" type="image/png">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ocean:#0c1628;
  --grid-line:#14253d;
  --horizons:#E8B44D;
  --sleep:#7B68EE;
  --garden:#5DCAA5;
  --abyss:#9B59B6;
  --circuit:#378ADD;
  --text-primary:#e0e6f0;
  --text-secondary:#7a8a9e;
  --panel-bg:rgba(10,18,35,0.92);
  --panel-border:rgba(255,255,255,0.08);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ocean);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text-primary)}

#map-container{width:100%;height:100%;position:relative;overflow:hidden;cursor:grab}
#map-container.dragging{cursor:grabbing}
#map-canvas{position:absolute;top:0;left:0;transform-origin:0 0}

/* Top bar */
#top-bar{position:fixed;top:0;left:0;right:0;height:48px;background:linear-gradient(180deg,rgba(10,18,35,0.95) 0%,rgba(10,18,35,0) 100%);display:flex;align-items:center;padding:0 20px;z-index:100;pointer-events:none}
#top-bar *{pointer-events:auto}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-area img{height:28px;opacity:0.9}
.logo-area span{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text-secondary)}

/* Nav buttons */
#world-nav{position:fixed;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:100}
.world-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--panel-border);background:var(--panel-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;position:relative}
.world-btn:hover{transform:scale(1.1);border-color:var(--btn-color)}
.world-btn:hover .btn-tooltip{opacity:1;transform:translateX(0)}
.world-btn .dot{width:14px;height:14px;border-radius:50%;background:var(--btn-color);opacity:0.8;transition:all 0.3s}
.world-btn:hover .dot{opacity:1;box-shadow:0 0 12px var(--btn-color)}
.world-btn.active{border-color:var(--btn-color);background:rgba(255,255,255,0.05)}
.world-btn.active .dot{opacity:1;box-shadow:0 0 16px var(--btn-color)}
.btn-tooltip{position:absolute;left:52px;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:6px;padding:6px 12px;white-space:nowrap;font-size:12px;opacity:0;transform:translateX(-8px);transition:all 0.2s;pointer-events:none}

/* Info panel */
#info-panel{position:fixed;right:16px;top:50%;transform:translateY(-50%);width:300px;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:100;overflow:hidden;opacity:0;pointer-events:none;transition:opacity 0.4s,transform 0.4s}
#info-panel.visible{opacity:1;pointer-events:auto}
.panel-header{padding:20px;border-bottom:1px solid var(--panel-border)}
.panel-header h2{font-size:18px;font-weight:500;margin-bottom:4px}
.panel-header .subtitle{font-size:12px;color:var(--text-secondary)}
.panel-body{padding:20px}
.panel-section{margin-bottom:16px}
.panel-section h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-secondary);margin-bottom:8px}
.panel-section p{font-size:13px;line-height:1.6;color:var(--text-primary);opacity:0.85}
.sub-list{display:flex;flex-direction:column;gap:6px}
.sub-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04)}
.sub-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.landmark-list{display:flex;flex-wrap:wrap;gap:4px}
.landmark-tag{font-size:11px;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);color:var(--text-secondary)}
.panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:6px;border:1px solid var(--panel-border);background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.2s}
.panel-close:hover{background:rgba(255,255,255,0.1);color:var(--text-primary)}
.character-bar{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);margin-bottom:16px}
.character-bar img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--world-color)}
.character-bar .char-info h4{font-size:14px;font-weight:500}
.character-bar .char-info span{font-size:11px;color:var(--text-secondary)}

/* Zoom controls */
#zoom-controls{position:fixed;bottom:20px;right:20px;display:flex;gap:4px;z-index:100}
#zoom-controls button{width:36px;height:36px;border-radius:8px;border:1px solid var(--panel-border);background:var(--panel-bg);color:var(--text-primary);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
#zoom-controls button:hover{background:rgba(255,255,255,0.1)}

/* Minimap */
#minimap{position:fixed;bottom:20px;left:16px;width:160px;height:100px;border-radius:8px;border:1px solid var(--panel-border);background:var(--panel-bg);z-index:100;overflow:hidden}
#minimap canvas{width:100%;height:100%}
#minimap .viewport-rect{position:absolute;border:1.5px solid rgba(255,255,255,0.5);border-radius:2px;pointer-events:none}

/* Hint */
#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-secondary);z-index:100;opacity:0.6;pointer-events:none;transition:opacity 1s}

/* Coordinates */
#coords{position:fixed;top:56px;right:16px;font-size:11px;color:var(--text-secondary);opacity:0.5;z-index:100;font-family:'Consolas','Courier New',monospace}

/* Preloader */
#preloader{position:fixed;inset:0;background:var(--ocean);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s}
#preloader.done{opacity:0;pointer-events:none}
#preloader .spinner{width:40px;height:40px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--garden);border-radius:50%;animation:spin 1s linear infinite}
#preloader p{margin-top:16px;font-size:13px;color:var(--text-secondary);letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  #info-panel{width:calc(100% - 32px);right:16px;top:auto;bottom:16px;transform:none;max-height:50vh;overflow-y:auto}
  #world-nav{left:8px;top:auto;bottom:80px;transform:none;flex-direction:row}
  .world-btn{width:36px;height:36px}
  .btn-tooltip{display:none}
}
</style>
</head>
<body>

<div id="preloader">
  <div class="spinner"></div>
  <p>Loading Resona...</p>
</div>

<div id="top-bar">
  <div class="logo-area">
    <img src="assets/logos/echoverse_full.png" alt="Echo Verse" onerror="this.style.display='none'">
    <span>World of Resona</span>
  </div>
</div>

<div id="world-nav"></div>

<div id="map-container">
  <canvas id="map-canvas"></canvas>
</div>

<div id="info-panel">
  <button class="panel-close" onclick="closePanel()">&times;</button>
  <div class="panel-header">
    <h2 id="panel-title"></h2>
    <div class="subtitle" id="panel-subtitle"></div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<div id="zoom-controls">
  <button onclick="zoomMap(1.3)" title="Zoom in">+</button>
  <button onclick="zoomMap(0.7)" title="Zoom out">&minus;</button>
  <button onclick="resetView()" title="Reset">&#8962;</button>
</div>

<div id="minimap"><canvas id="minimap-canvas"></canvas><div class="viewport-rect" id="viewport-rect"></div></div>

<div id="hint">Drag to pan &middot; Scroll to zoom &middot; Click a region to explore</div>

const ROUTES = [
  {from:"horizons",to:"sleep",name:"Dreampath",style:"dream"},
  {from:"horizons",to:"garden",name:"Vine Bridge",style:"vine"},
  {from:"garden",to:"circuit",name:"Cable Strait",style:"cable"},
  {from:"garden",to:"abyss",name:"Root Descent",style:"root"},
  {from:"abyss",to:"circuit",name:"Ember Cable",style:"ember"}
];

// ============ MAP ENGINE ============
const MAP_W = 3200, MAP_H = 2000;
const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');
canvas.width = MAP_W;
canvas.height = MAP_H;

const mmCanvas = document.getElementById('minimap-canvas');
const mmCtx = mmCanvas.getContext('2d');
mmCanvas.width = 320;
mmCanvas.height = 200;

let viewX = 0, viewY = 0, zoom = 1;
let targetZoom = 1, targetX = 0, targetY = 0;
let isDragging = false, dragStartX, dragStartY, dragViewX, dragViewY;
let activeWorld = null;
let animFrame;
let tiltX = 0, tiltY = 0;

function init() {
  const vw = window.innerWidth, vh = window.innerHeight;
  zoom = Math.max(vw / MAP_W, vh / MAP_H);
  targetZoom = zoom;
  viewX = (MAP_W * zoom - vw) / 2;
  viewY = (MAP_H * zoom - vh) / 2;
  targetX = viewX;
  targetY = viewY;
  buildNav();
  render();
  setTimeout(() => document.getElementById('preloader').classList.add('done'), 600);
  setTimeout(() => {
    const hint = document.getElementById('hint');
    if(hint) hint.style.opacity = '0';
  }, 5000);
}

function buildNav() {
  const nav = document.getElementById('world-nav');
  Object.entries(WORLDS).forEach(([key, w]) => {
    const btn = document.createElement('button');
    btn.className = 'world-btn';
    btn.style.setProperty('--btn-color', w.color);
    btn.dataset.world = key;
    btn.innerHTML = `<div class="dot" style="background:${w.color}"></div><div class="btn-tooltip">${w.name}</div>`;
    btn.onclick = () => flyToWorld(key);
    nav.appendChild(btn);
  });
}

// ============ DRAWING ============
function drawMap() {
  ctx.clearRect(0, 0, MAP_W, MAP_H);

  // Ocean
  ctx.fillStyle = '#0c1628';
  ctx.fillRect(0, 0, MAP_W, MAP_H);

  // Grid
  ctx.strokeStyle = '#14253d';
  ctx.lineWidth = 0.5;
  for(let x = 0; x < MAP_W; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_H); ctx.stroke();
  }
  for(let y = 0; y < MAP_H; y += 80) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_W, y); ctx.stroke();
  }

  // Routes
  ROUTES.forEach(r => {
    const a = WORLDS[r.from], b = WORLDS[r.to];
    const ax = a.cx * MAP_W, ay = a.cy * MAP_H;
    const bx = b.cx * MAP_W, by = b.cy * MAP_H;
    const mx = (ax + bx) / 2 + (by - ay) * 0.15;
    const my = (ay + by) / 2 - (bx - ax) * 0.15;
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = 'rgba(60,80,120,0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(mx, my, bx, by);
    ctx.stroke();
    ctx.setLineDash([]);
    // Route label
    const lx = (ax + 2*mx + bx) / 4, ly = (ay + 2*my + by) / 4;
    ctx.font = '11px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(80,110,150,0.4)';
    ctx.textAlign = 'center';
    ctx.fillText(r.name, lx, ly);
  });

  // Continents
  Object.entries(WORLDS).forEach(([key, w]) => {
    drawContinent(key, w);
  });

  // Compass rose
  drawCompass();
}

function drawContinent(key, w) {
  const pts = w.path.map(p => ({x: p.x * MAP_W, y: p.y * MAP_H}));
  const isActive = activeWorld === key;

  // Outer glow
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i = 1; i < pts.length; i++) {
    const prev = pts[i-1], curr = pts[i], next = pts[(i+1) % pts.length];
    const cpx = curr.x, cpy = curr.y;
    ctx.lineTo(cpx, cpy);
  }
  ctx.closePath();
  ctx.shadowColor = w.color;
  ctx.shadowBlur = isActive ? 40 : 15;
  ctx.fillStyle = w.colorDark;
  ctx.fill();
  ctx.restore();

  // Inner terrain
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.clip();

  // Base fill
  const grad = ctx.createRadialGradient(w.cx*MAP_W, w.cy*MAP_H, 0, w.cx*MAP_W, w.cy*MAP_H, MAP_W*0.15);
  grad.addColorStop(0, w.color + '30');
  grad.addColorStop(0.5, w.colorDark + 'a0');
  grad.addColorStop(1, w.colorDark + '60');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, MAP_W, MAP_H);

  // Terrain noise
  const seed = key.charCodeAt(0);
  for(let i = 0; i < 60; i++) {
    const nx = w.cx * MAP_W + (pseudoRand(seed + i*3) - 0.5) * MAP_W * 0.22;
    const ny = w.cy * MAP_H + (pseudoRand(seed + i*3+1) - 0.5) * MAP_H * 0.25;
    const r = pseudoRand(seed + i*3+2) * 50 + 15;
    ctx.beginPath();
    ctx.arc(nx, ny, r, 0, Math.PI*2);
    ctx.fillStyle = w.color + (key === 'circuit' ? '08' : '12');
    ctx.fill();
  }

  // World-specific terrain details
  if(key === 'horizons') drawDesertTerrain(w);
  else if(key === 'sleep') drawDreamTerrain(w);
  else if(key === 'garden') drawJungleTerrain(w);
  else if(key === 'abyss') drawVolcanicTerrain(w);
  else if(key === 'circuit') drawCityTerrain(w);

  ctx.restore();

  // Border
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.strokeStyle = w.color + (isActive ? '80' : '40');
  ctx.lineWidth = isActive ? 2 : 1;
  ctx.stroke();

  // Region label
  ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = w.color;
  ctx.fillText(w.name.toUpperCase(), w.cx * MAP_W, w.cy * MAP_H - 30);
  ctx.font = '12px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = w.color + 'a0';
  ctx.fillText(w.world + ' — ' + w.character, w.cx * MAP_W, w.cy * MAP_H - 14);

  // Emblem circle
  ctx.beginPath();
  ctx.arc(w.cx * MAP_W, w.cy * MAP_H, 10, 0, Math.PI * 2);
  ctx.fillStyle = w.color;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(w.cx * MAP_W, w.cy * MAP_H, 16, 0, Math.PI * 2);
  ctx.strokeStyle = w.color + '50';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Landmark pins
  const showLabels = zoom > 0.6;
  w.landmarks_pos.forEach(lm => {
    const lx = lm.x * MAP_W, ly = lm.y * MAP_H;
    if(lm.main || zoom > 0.8) {
      ctx.beginPath();
      ctx.arc(lx, ly, lm.main ? 5 : 3.5, 0, Math.PI * 2);
      ctx.fillStyle = lm.main ? w.color : w.color + '80';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(lx, ly, lm.main ? 8 : 5.5, 0, Math.PI * 2);
      ctx.strokeStyle = w.color + '30';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
    if(showLabels && (lm.main || zoom > 1.0)) {
      ctx.font = (lm.main ? '12' : '10') + 'px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = w.color + (lm.main ? 'cc' : '80');
      ctx.fillText(lm.name, lx + (lm.main ? 10 : 7), ly + 4);
    }
  });
}

function drawDesertTerrain(w) {
  // Sand dunes
  for(let i = 0; i < 15; i++) {
    const x = w.cx*MAP_W + (pseudoRand(100+i) - 0.5) * MAP_W * 0.18;
    const y = w.cy*MAP_H + (pseudoRand(200+i) - 0.5) * MAP_H * 0.2;
    ctx.beginPath();
    ctx.ellipse(x, y, 40 + pseudoRand(300+i)*30, 15, pseudoRand(400+i)*Math.PI, 0, Math.PI*2);
    ctx.fillStyle = '#E8B44D10';
    ctx.fill();
  }
}

function drawDreamTerrain(w) {
  // Floating mist patches
  for(let i = 0; i < 20; i++) {
    const x = w.cx*MAP_W + (pseudoRand(500+i) - 0.5) * MAP_W * 0.25;
    const y = w.cy*MAP_H + (pseudoRand(600+i) - 0.5) * MAP_H * 0.08;
    ctx.beginPath();
    ctx.arc(x, y, 8 + pseudoRand(700+i)*15, 0, Math.PI*2);
    ctx.fillStyle = '#7B68EE08';
    ctx.fill();
  }
}

function drawJungleTerrain(w) {
  // Tree canopy dots
  for(let i = 0; i < 40; i++) {
    const x = w.cx*MAP_W + (pseudoRand(800+i) - 0.5) * MAP_W * 0.18;
    const y = w.cy*MAP_H + (pseudoRand(900+i) - 0.5) * MAP_H * 0.22;
    ctx.beginPath();
    ctx.arc(x, y, 5 + pseudoRand(1000+i)*8, 0, Math.PI*2);
    ctx.fillStyle = '#5DCAA510';
    ctx.fill();
  }
}

function drawVolcanicTerrain(w) {
  // Miasma fog patches (violet-black)
  for(let i = 0; i < 18; i++) {
    const x = w.cx*MAP_W + (pseudoRand(1100+i) - 0.5) * MAP_W * 0.16;
    const y = w.cy*MAP_H + (pseudoRand(1200+i) - 0.5) * MAP_H * 0.16;
    const r = 20 + pseudoRand(1300+i) * 40;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(80,30,100,0.08)';
    ctx.fill();
  }
  // Faint amber cracks underground
  for(let i = 0; i < 5; i++) {
    const sx = w.cx*MAP_W + (pseudoRand(1400+i) - 0.5) * MAP_W * 0.10;
    const sy = w.cy*MAP_H + (pseudoRand(1500+i) - 0.5) * MAP_H * 0.10;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + (pseudoRand(1600+i)-0.5)*50, sy + pseudoRand(1700+i)*30);
    ctx.strokeStyle = 'rgba(200,160,60,0.10)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
}

function drawCityTerrain(w) {
  // Grid lines (city blocks)
  for(let i = 0; i < 12; i++) {
    const x = w.cx*MAP_W + (pseudoRand(1500+i) - 0.5) * MAP_W * 0.12;
    const y = w.cy*MAP_H + (pseudoRand(1600+i) - 0.5) * MAP_H * 0.18;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (pseudoRand(1700+i)-0.5)*30, y);
    ctx.strokeStyle = '#378ADD15';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawCompass() {
  const cx = 120, cy = 130, r = 45;
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = '#4a6a8a';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r - 8, 0, Math.PI*2);
  ctx.stroke();
  // Cross
  ctx.beginPath();
  ctx.moveTo(cx, cy - r + 4); ctx.lineTo(cx, cy + r - 4);
  ctx.moveTo(cx - r + 4, cy); ctx.lineTo(cx + r - 4, cy);
  ctx.strokeStyle = '#4a6a8a';
  ctx.lineWidth = 0.5;
  ctx.stroke();
  // Letters
  ctx.font = '14px Georgia, serif';
  ctx.fillStyle = '#4a6a8a';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy - r - 6);
  ctx.fillText('S', cx, cy + r + 14);
  ctx.fillText('W', cx - r - 10, cy + 5);
  ctx.fillText('E', cx + r + 10, cy + 5);
  ctx.restore();
}

function pseudoRand(seed) {
  let x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// ============ VIEW CONTROL ============
function render() {
  // Smooth interpolation
  viewX += (targetX - viewX) * 0.12;
  viewY += (targetY - viewY) * 0.12;
  zoom += (targetZoom - zoom) * 0.12;

  const vw = window.innerWidth, vh = window.innerHeight;

  // Apply transform with slight perspective tilt
  const tx = -viewX;
  const ty = -viewY;
  canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${zoom}) perspective(2000px) rotateX(${tiltY * 0.5}deg) rotateY(${-tiltX * 0.5}deg)`;
  canvas.style.width = MAP_W + 'px';
  canvas.style.height = MAP_H + 'px';

  drawMap();
  drawMinimap();
  updateCoords();

  animFrame = requestAnimationFrame(render);
}

function zoomMap(factor) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const cx = viewX + vw / 2;
  const cy = viewY + vh / 2;
  targetZoom = Math.max(0.3, Math.min(3, targetZoom * factor));
  targetX = cx * (targetZoom / zoom) - vw / 2;
  targetY = cy * (targetZoom / zoom) - vh / 2;
}

function resetView() {
  const vw = window.innerWidth, vh = window.innerHeight;
  targetZoom = Math.max(vw / MAP_W, vh / MAP_H);
  targetX = (MAP_W * targetZoom - vw) / 2;
  targetY = (MAP_H * targetZoom - vh) / 2;
  activeWorld = null;
  document.getElementById('info-panel').classList.remove('visible');
  document.querySelectorAll('.world-btn').forEach(b => b.classList.remove('active'));
}

function flyToWorld(key) {
  const w = WORLDS[key];
  const vw = window.innerWidth, vh = window.innerHeight;
  targetZoom = 1.2;
  targetX = w.cx * MAP_W * targetZoom - vw / 2;
  targetY = w.cy * MAP_H * targetZoom - vh / 2;
  activeWorld = key;
  showPanel(key);
  document.querySelectorAll('.world-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.world === key);
  });
}

function showPanel(key) {
  const w = WORLDS[key];
  const panel = document.getElementById('info-panel');
  document.getElementById('panel-title').textContent = w.name;
  document.getElementById('panel-title').style.color = w.color;
  document.getElementById('panel-subtitle').textContent = w.world;

  let html = '';
  html += `<div class="character-bar" style="--world-color:${w.color}">`;
  html += `<img src="${w.portrait}" alt="${w.character}" onerror="this.style.display='none'">`;
  html += `<div class="char-info"><h4 style="color:${w.color}">${w.character}</h4><span>${w.role}</span></div></div>`;
  html += `<div class="panel-section"><h3>Description</h3><p>${w.description}</p></div>`;
  html += `<div class="panel-section"><h3>Sub-series</h3><div class="sub-list">`;
  w.subs.forEach(s => {
    html += `<div class="sub-item"><div class="sub-dot" style="background:${w.color}"></div>${s}</div>`;
  });
  html += `</div></div>`;
  html += `<div class="panel-section"><h3>Landmarks</h3><div class="landmark-list">`;
  w.landmarks.forEach(l => {
    html += `<span class="landmark-tag" style="border-color:${w.color}30">${l}</span>`;
  });
  html += `</div></div>`;

  document.getElementById('panel-body').innerHTML = html;
  panel.classList.add('visible');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('visible');
  activeWorld = null;
  document.querySelectorAll('.world-btn').forEach(b => b.classList.remove('active'));
}

// ============ MINIMAP ============
function drawMinimap() {
  const mw = 320, mh = 200;
  mmCtx.clearRect(0, 0, mw, mh);
  mmCtx.fillStyle = '#0a1220';
  mmCtx.fillRect(0, 0, mw, mh);

  Object.values(WORLDS).forEach(w => {
    mmCtx.beginPath();
    mmCtx.arc(w.cx * mw, w.cy * mh, 8, 0, Math.PI*2);
    mmCtx.fillStyle = w.color + '40';
    mmCtx.fill();
    mmCtx.beginPath();
    mmCtx.arc(w.cx * mw, w.cy * mh, 3, 0, Math.PI*2);
    mmCtx.fillStyle = w.color;
    mmCtx.fill();
  });

  // Viewport rect
  const vw = window.innerWidth, vh = window.innerHeight;
  const rx = (viewX / (MAP_W * zoom)) * mw;
  const ry = (viewY / (MAP_H * zoom)) * mh;
  const rw = (vw / (MAP_W * zoom)) * mw;
  const rh = (vh / (MAP_H * zoom)) * mh;
  const rect = document.getElementById('viewport-rect');
  rect.style.left = Math.max(0, rx) + 'px';
  rect.style.top = Math.max(0, ry) + 'px';
  rect.style.width = Math.min(rw, mw) + 'px';
  rect.style.height = Math.min(rh, mh) + 'px';
}

function updateCoords() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const cx = (viewX + vw/2) / (MAP_W * zoom);
  const cy = (viewY + vh/2) / (MAP_H * zoom);
  document.getElementById('coords').textContent = `${(cx*100).toFixed(1)}E ${(cy*100).toFixed(1)}S  z${zoom.toFixed(2)}`;
}

// ============ MOUSE EVENTS ============
const container = document.getElementById('map-container');

container.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragViewX = targetX;
  dragViewY = targetY;
  container.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if(isDragging) {
    targetX = dragViewX - (e.clientX - dragStartX);
    targetY = dragViewY - (e.clientY - dragStartY);
  }
  // Subtle tilt
  const vw = window.innerWidth, vh = window.innerHeight;
  tiltX = ((e.clientX / vw) - 0.5) * 2;
  tiltY = ((e.clientY / vh) - 0.5) * 2;
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  container.classList.remove('dragging');
});

container.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  const vw = window.innerWidth, vh = window.innerHeight;
  const mx = e.clientX, my = e.clientY;
  const worldX = (viewX + mx) / zoom;
  const worldY = (viewY + my) / zoom;
  targetZoom = Math.max(0.3, Math.min(3, targetZoom * factor));
  targetX = worldX * targetZoom - mx;
  targetY = worldY * targetZoom - my;
}, {passive: false});

// Click detection for continents
container.addEventListener('click', e => {
  if(Math.abs(e.clientX - dragStartX) > 5 || Math.abs(e.clientY - dragStartY) > 5) return;
  const worldX = (viewX + e.clientX) / zoom / MAP_W;
  const worldY = (viewY + e.clientY) / zoom / MAP_H;
  let closest = null, minDist = 0.1;
  Object.entries(WORLDS).forEach(([key, w]) => {
    const d = Math.sqrt((worldX - w.cx)**2 + (worldY - w.cy)**2);
    if(d < minDist) { minDist = d; closest = key; }
  });
  if(closest) flyToWorld(closest);
});

// Touch support
let lastTouchDist = 0;
container.addEventListener('touchstart', e => {
  if(e.touches.length === 1) {
    isDragging = true;
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    dragViewX = targetX;
    dragViewY = targetY;
  } else if(e.touches.length === 2) {
    lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, {passive: true});

container.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length === 1 && isDragging) {
    targetX = dragViewX - (e.touches[0].clientX - dragStartX);
    targetY = dragViewY - (e.touches[0].clientY - dragStartY);
  } else if(e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if(lastTouchDist > 0) {
      const factor = dist / lastTouchDist;
      targetZoom = Math.max(0.3, Math.min(3, targetZoom * factor));
    }
    lastTouchDist = dist;
  }
}, {passive: false});

container.addEventListener('touchend', () => { isDragging = false; lastTouchDist = 0; });

// Keyboard
window.addEventListener('keydown', e => {
  if(e.key === 'Escape') closePanel();
  if(e.key === '+' || e.key === '=') zoomMap(1.2);
  if(e.key === '-') zoomMap(0.8);
  if(e.key === '0') resetView();
});

window.addEventListener('resize', () => {
  if(!activeWorld) resetView();
});

// ============ BOOT ============
init();
</script>
</body>
</html>
