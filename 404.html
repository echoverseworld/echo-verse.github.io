<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#04060b;color:#8b93a8;font-family:'Share Tech Mono',ui-monospace,monospace;
  min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:24px;overflow:hidden;position:relative;
}
/* Rauschen */
body::before{
  content:"";position:fixed;inset:-50%;pointer-events:none;opacity:.06;
  background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 .0001%,transparent 0 .8%),repeating-radial-gradient(circle at 81% 64%,#fff 0 .0001%,transparent 0 .6%);
  background-size:11px 11px,7px 7px;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
}
.box{position:relative;width:min(640px,100%)}
.fq{font-size:clamp(3rem,12vw,6rem);color:#dfe4f0;letter-spacing:.1em}
.lost{font-size:clamp(1rem,3vw,1.4rem);letter-spacing:.4em;color:#FF2D9B;margin-top:.6rem}
p{margin:2rem auto 0;font-size:.85rem;letter-spacing:.08em;color:#565e72;max-width:34em}
/* Skala der Startseite: die Nadel sucht und findet nichts */
.dial{position:relative;height:56px;margin:2.6rem auto 0;max-width:520px}
.scale{
  position:absolute;left:0;right:0;top:20px;height:12px;
  background:
    repeating-linear-gradient(90deg,rgba(160,180,220,.45) 0 1px,transparent 1px 10%) 0 0/100% 12px no-repeat,
    repeating-linear-gradient(90deg,rgba(160,180,220,.2) 0 1px,transparent 1px 2%) 0 6px/100% 6px no-repeat;
}
.scale::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(160,180,220,.4) 5%,rgba(160,180,220,.4) 95%,transparent)}
.needle{position:absolute;top:4px;bottom:4px;left:50%;width:2px;margin-left:-1px;background:#565e72;border-radius:1px}
.needle::before{content:"";position:absolute;top:-1px;left:-4px;border:5px solid transparent;border-top-color:#565e72}
.st{position:absolute;bottom:0;transform:translateX(-50%);font-size:.6rem;letter-spacing:.06em;color:#3d4353}
.st::before{content:"";position:absolute;left:50%;top:-24px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#3d4353}
.readout{margin-top:.9rem;font-size:.66rem;letter-spacing:.2em;color:#565e72;min-height:1.4em}
a{display:inline-block;margin-top:2.4rem;color:#22D3EE;text-decoration:none;
  border:1px solid rgba(34,211,238,.5);padding:.9em 1.9em;border-radius:2px;
  font-size:.8rem;letter-spacing:.2em}
a:hover{background:rgba(34,211,238,.09);box-shadow:0 0 22px rgba(34,211,238,.25)}
.links{margin-top:1.4rem;font-size:.7rem;letter-spacing:.16em}
.links a{display:inline;margin:0 .8em;border:0;padding:0;color:#8b93a8;font-size:inherit}
.links a:hover{color:#dfe4f0;background:none;box-shadow:none}
.links a#runLink{color:#FF2D9B;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  body::before{animation:st .18s steps(2) infinite}
  @keyframes st{50%{transform:translate(6px,-4px)}}
  .fq{animation:fl 4s infinite}
  @keyframes fl{0%,100%{opacity:1}93%{opacity:1}94%{opacity:.4}96%{opacity:.9}}
  .needle{animation:seek 11s ease-in-out infinite}
  @keyframes seek{0%{left:6%}22%{left:38%}30%{left:33%}52%{left:81%}60%{left:76%}82%{left:18%}100%{left:6%}}
}
</style>
</head>
<body>
<div class="box">
  <div class="fq">4▓4.0 FM</div>
  <div class="lost">SIGNAL LOST</div>
  <p>this frequency returns only static.<br>whatever was archived here has not been reconstructed. yet.</p>
  <div class="dial" aria-hidden="true">
    <div class="scale"></div>
    <span class="st" style="left:7%">89.2</span><span class="st" style="left:38%">95.3</span><span class="st" style="left:66%">100.4</span><span class="st" style="left:88.5%">106.5</span>
    <div class="needle"></div>
  </div>
  <div class="readout" aria-hidden="true">SCANNING &nbsp;·&nbsp; NO CARRIER</div>
  <a href="/">↩ BACK TO THE BAND</a>
  <div class="links"><a href="/archive.html">ALL TRANSMISSIONS</a><a href="/codex.html">CODEX</a><a href="#run" id="runLink" hidden>▶ RUN THE CARRIER</a></div>
</div>
