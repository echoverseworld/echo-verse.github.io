# Holt alle 6h die neuesten VEROEFFENTLICHTEN Mixe (keine Shorts, keine
# scheduled/privaten Videos) ueber die YouTube Data API (Secret YT_API_KEY)
# und schreibt assets/latest.json. Die Website embeddet genau diese IDs.
name: latest-signal

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest published mixes (YouTube Data API)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 .github/scripts/latest_signal.py

      - name: Commit if changed
        run: |
          git config user.name "echo-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest.json
          # Thumbnails koennen beim Fehlschlag des Downloads fehlen -- dann nicht rot werden
          git add assets/latest_frequency.jpg assets/latest_drift.jpg assets/latest_pulse.jpg assets/latest_vigil.jpg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "latest signal update"
            git push
          else
            echo "Keine Aenderung."
          fi

      # Feed-Ausfaelle laesst latest_signal.py bewusst gruen durchlaufen (die
      # Seite zeigt dann die alten Videos). Haelt das laenger an, soll der Run
      # ROT werden -- GitHub mailt bei fehlgeschlagenen Workflows.
      - name: Alarm bei veralteter latest.json
        env:
          MAX_AGE_HOURS: "48"
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          updated = json.load(open("assets/latest.json", encoding="utf-8"))["updated"]
          age_h = (datetime.now(timezone.utc) - datetime.strptime(updated, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)).total_seconds() / 3600
          limit = float(os.environ["MAX_AGE_HOURS"])
          print(f"latest.json updated={updated}, Alter {age_h:.1f} h (Grenze {limit:.0f} h)")
          if age_h > limit:
              print(f"::error::latest.json seit {age_h:.0f} h nicht aktualisiert -- YouTube-Feeds pruefen.")
              sys.exit(1)
          PY
